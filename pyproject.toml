[project]
name = "pundits-vs-bookies"
version = "0.1.0"
description = "Can pundits beat the bookies? Scraping and text analysis of match previews against betting odds."
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests", "pvb"]
pythonpath = ["."]
addopts = "--doctest-modules"
